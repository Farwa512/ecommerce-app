trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: Compile
  jobs:
  - job: compile
    displayName: Install and compile
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: Install dependencies
    - script: python -m compileall -q .
      displayName: Compile check
