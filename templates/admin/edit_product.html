{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow border-0 overflow-hidden">
      <div class="p-4 text-white" style="background: linear-gradient(135deg, #6f42c1, #343a40);">
        <h3 class="mb-1"><i class="bi bi-pencil-square"></i> Edit Product</h3>
        <p class="mb-0 opacity-75">Update the product details below.</p>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Product Name</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ product.description or '' }}</textarea>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold">Price (Rs.)</label>
              <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold">Stock</label>
              <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Category</label>
            <input type="text" name="category" class="form-control" value="{{ product.category or '' }}" placeholder="e.g. Shirts, Shoes">
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold">Available Sizes</label>
              <input type="text" name="sizes" class="form-control" value="{{ product.sizes or '' }}" placeholder="e.g. S,M,L,XL">
              <div class="form-text">Separate with commas.</div>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold">Available Colors</label>
              <input type="text" name="colors" class="form-control" value="{{ product.colors or '' }}" placeholder="e.g. Black,White,Blue">
              <div class="form-text">Separate with commas.</div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">Update Product</button>
            <a href="{{ url_for('manage_products') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
