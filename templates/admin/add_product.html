{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow border-0 overflow-hidden">
      <div class="p-4 text-white" style="background: linear-gradient(135deg, #6f42c1, #343a40);">
        <h3 class="mb-1"><i class="bi bi-bag-plus"></i> Add New Product</h3>
        <p class="mb-0 opacity-75">Fill in the details below to list a new product.</p>
      </div>
      <div class="card-body p-4">
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-tag"></i> Product Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Cotton T-Shirt" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-card-text"></i> Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Product details..."></textarea>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold"><i class="bi bi-currency-rupee"></i> Price</label>
              <div class="input-group">
                <span class="input-group-text">Rs.</span>
                <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
              </div>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold"><i class="bi bi-boxes"></i> Stock</label>
              <input type="number" name="stock" class="form-control" placeholder="0" required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold"><i class="bi bi-image"></i> Product Image</label>
            <input type="file" name="image" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-plus-circle"></i> Add Product
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
